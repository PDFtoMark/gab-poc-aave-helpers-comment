name: Test
on:
  push:
    branches: [main]
  pull_request:
jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - name: attacker-controlled workflow in fork PR
        run: |
          mkdir -p content
          printf 'x\n' > 'content/FORKPR$(id).txt'
      - uses: actions/upload-artifact@v4
        with:
          name: content
          path: content/
